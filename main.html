  </p>

  <div class="status">
    <span class="badge">👹 Monster: <span id="monsterInfo">None</span></span>
    <span class="badge">🧍 Hero HP: <span id="heroHp">100</span></span>
    <span class="badge">💀 Monsters created: <span id="monsterCount">0</span></span>
  </div>

  <div id="controls">
    <button id="spawnBtn">Spawn Random Monster</button>

    <button id="resetHeroBtn">Reset Hero HP</button>

  <div id="log"></div>

  <script>
    // ================== PARENT CLASS ==================

    class Monster {

      static totalMonsters = 0;

      constructor(name, type, health, damage) {
        this.name = name;
        this.type = type;
        this.health = health;
        this.damage = damage;
        this.alive = true;

        Monster.totalMonsters = Monster.totalMonsters + 1;
      }

      roar() {
        const message = this.name + " the " + this.type + " roars!";
        return message;
      }

      attack() {
        const message = this.name + " attacks for " + this.damage + " damage!";
        return message;
      }

      takeDamage(amount) {
        if (this.alive === false) {
          return this.name + " is already defeated.";
        }

        this.health = this.health - amount;

        if (this.health <= 0) {
          this.health = 0;
          this.alive = false;
        }

        const message = this.name + " takes " + amount + " damage. Health: " + this.health;
        return message;
      }

      isDead() {
        if (this.alive === false) {
          return true;
        } else {
          return false;
        }
      }

      specialMove() {
        const message = this.name + " tries to do something special, but nothing happens.";
        return message;
      }

      static getTotalMonsters() {
        return Monster.totalMonsters;
      }

      // Factory: creates a random child monster
      static createRandomMonster() {
        const names = ["Gloom", "Shadow", "Rotfang", "Nightclaw", "Grimjaw", "Ashfang"];
        const randomNameIndex = Math.floor(Math.random() * names.length);
        const randomName = names[randomNameIndex];

        const randomTypeIndex = Math.floor(Math.random() * 4);

        if (randomTypeIndex === 0) {
          return new Vampire(randomName, "Vampire", 80, 16);
        }

        if (randomTypeIndex === 1) {
          return new Zombie(randomName, "Zombie", 110, 10);
        }

        if (randomTypeIndex === 2) {
          return new Werewolf(randomName, "Werewolf", 95, 20);
        }

        return new Ghost(randomName, "Ghost", 70, 14);
      }
    }

    // ================== CHILD CLASSES ==================

    class Vampire extends Monster {

      specialMove() {
        // Life drain: heal 10 HP
        const healAmount = 10;
        this.health = this.health + healAmount;

        const message = this.name + " the Vampire drains life and heals " +
          healAmount + " HP! New health: " + this.health + " 🩸";
        return message;
      }

      attack() {
        const message = this.name + " the Vampire bites for " + this.damage + " damage! 🩸";
        return message;
      }
    }

    class Zombie extends Monster {

      specialMove() {
        // Lazy initialize revive flag
        if (this.hasRevived === undefined) {
          this.hasRevived = false;
        }

        if (this.isDead() === true && this.hasRevived === false) {
          this.health = 40;
          this.alive = true;
          this.hasRevived = true;

          const message = this.name +
            " the Zombie rises again with 40 HP! Second chance! 🧟‍♂️";
          return message;
        }

        if (this.hasRevived === true) {
          const message = this.name + " already used its revive ability.";
          return message;
        }

        const message = this.name +
          " moans and shambles around. Nothing special happens. 🧟";
        return message;
      }

      attack() {
        const message = this.name + " the Zombie smashes forward for " +
          this.damage + " damage! 🧠";
        return message;
      }
    }

    class Werewolf extends Monster {

      specialMove() {
        if (this.rageMode === undefined) {
          this.rageMode = false;
        }

        if (this.rageMode === false) {
          this.rageMode = true;
          this.damage = this.damage * 2;

          const message = this.name +
            " the Werewolf enters RAGE MODE! Damage doubled! 🌕🔥";
          return message;
        } else {
          const message = this.name +
            " is already in rage mode and growls angrily.";
          return message;
        }
      }

      attack() {
        const message = this.name + " the Werewolf pounces and claws for " +
          this.damage + " damage! 🌕";
        return message;
      }
    }

    class Ghost extends Monster {

      specialMove() {
        if (this.phased === undefined) {
          this.phased = false;
        }

        this.phased = true;

        const message = this.name +
          " the Ghost becomes transparent and will dodge the next attack! 👻";
        return message;
      }

      takeDamage(amount) {
        if (this.phased === true) {
          this.phased = false;
          const message = this.name +
            " phases through the attack and takes 0 damage! 👻✨";
          return message;
        }

        // Use parent logic
        const result = super.takeDamage(amount);
        return result;
      }

      attack() {
        const message = this.name + " the Ghost haunts the hero for " +
          this.damage + " damage! 👻";
        return message;
      }
    }

    // ================== SIMPLE GAME LOGIC ==================

    const logDiv = document.getElementById("log");
    const monsterInfoSpan = document.getElementById("monsterInfo");
    const heroHpSpan = document.getElementById("heroHp");
    const monsterCountSpan = document.getElementById("monsterCount");

    const spawnBtn = document.getElementById("spawnBtn");
    const heroAttackBtn = document.getElementById("heroAttackBtn");
    const monsterSpecialBtn = document.getElementById("monsterSpecialBtn");
    const resetHeroBtn = document.getElementById("resetHeroBtn");

    let heroHealth = 100;
    let currentMonster = null;

    function log(text, type) {
      const p = document.createElement("p");
      p.className = "log-line";

      if (type === "hero") {
        p.classList.add("hero");
      }

      if (type === "monster") {
        p.classList.add("monster");
      }

      if (type === "warning") {
        p.classList.add("warning");
      }

      if (type === "danger") {
        p.classList.add("danger");
      }

      if (type === "system") {
        p.classList.add("system");
      }

      p.textContent = text;
      logDiv.appendChild(p);
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function logDivider() {
      const div = document.createElement("div");
      div.className = "log-divider";
      logDiv.appendChild(div);
    }

    function updateStatus() {
      if (currentMonster === null) {
        monsterInfoSpan.textContent = "None";
      } else {
        monsterInfoSpan.textContent =
          currentMonster.name + " (" + currentMonster.type +
          ", HP: " + currentMonster.health + ", DMG: " + currentMonster.damage + ")";
      }

      heroHpSpan.textContent = heroHealth;
      monsterCountSpan.textContent = Monster.getTotalMonsters();
    }

    spawnBtn.addEventListener("click", function () {
      currentMonster = Monster.createRandomMonster();
      logDivider();
      log("A new monster appears!", "system");
      log(currentMonster.roar(), "monster");
      updateStatus();
    });

    heroAttackBtn.addEventListener("click", function () {
      if (currentMonster === null) {
        log("There is no monster yet. Spawn one first.", "warning");
        return;
      }

      if (currentMonster.isDead() === true) {
        log(currentMonster.name + " is already defeated. Spawn a new monster.", "warning");
        return;
      }

      if (heroHealth <= 0) {
        log("The hero has 0 HP. Reset the hero first.", "danger");
        return;
      }

      const heroDamage = Math.floor(Math.random() * 11) + 10; // 10–20
      log("Hero attacks for " + heroDamage + " damage!", "hero");
      log(currentMonster.takeDamage(heroDamage), "monster");

      if (currentMonster.isDead() === true) {
        log("✅ " + currentMonster.name + " the " + currentMonster.type +
          " has been defeated!", "system");
        updateStatus();
        return;
      }

      log(currentMonster.attack(), "monster");
      heroHealth = heroHealth - currentMonster.damage;

      if (heroHealth < 0) {
        heroHealth = 0;
      }

      if (heroHealth <= 0) {
        log("💥 The hero has been defeated!", "danger");
      }

      updateStatus();
    });

    monsterSpecialBtn.addEventListener("click", function () {
      if (currentMonster === null) {
        log("There is no monster yet. Spawn one first.", "warning");
        return;
      }

      const result = currentMonster.specialMove();
      log(result, "monster");
      updateStatus();
    });

    resetHeroBtn.addEventListener("click", function () {
      heroHealth = 100;
      log("Hero HP has been reset to 100.", "system");
      updateStatus();
    });

    // Initial message
    log("Welcome to the Monster Arena!", "system");
    log("Click \"Spawn Random Monster\" to begin.", "system");
    updateStatus();
  </script> -->
